name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Android release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wolf-den-release.jks"

      - name: Build release APK and AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wolf-den-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease
      - name: Verify release APK and AAB outputs
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            ls -lh app/build/outputs/apk/release/app-release.apk
            sha256sum app/build/outputs/apk/release/app-release.apk
          else
            test -f app/build/outputs/apk/release/app-release-unsigned.apk
            ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
            sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: wolf-den-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wolf-den-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
