name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/wolf-den-release.jks" \
            -storepass "wolfden-test-store" \
            -keypass "wolfden-test-key" \
            -alias "wolf-den" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Wolf Den, OU=Wolf Den, O=Wolf Den, L=Babol, ST=Mazandaran, C=IR"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release APK and AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wolf-den-release.jks
          ANDROID_KEYSTORE_PASSWORD: wolfden-test-store
          ANDROID_KEY_ALIAS: wolf-den
          ANDROID_KEY_PASSWORD: wolfden-test-key
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify signed release APK and AAB outputs
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: wolf-den-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wolf-den-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
